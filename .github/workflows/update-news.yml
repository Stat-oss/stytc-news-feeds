
name: Update Hip-Hop News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download news feeds
        run: |
          mkdir -p rss
          curl -fLsS --retry 3 --max-time 45 "https://allhiphop.com/feed/" -o rss/allhiphop.xml
          curl -fLsS --retry 3 --max-time 45 "https://hiphopwired.com/feed/" -o rss/hiphopwired.xml

      - name: Save updated headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss/
          git diff --cached --quiet || (git commit -m "Update hip-hop news" && git push)
